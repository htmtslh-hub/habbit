<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Coin Background Base -->
  <circle cx="24" cy="24" r="23" fill="#070b12"/>
  <!-- Outer Gold Rim -->
  <circle cx="24" cy="24" r="21.5" stroke="url(#favGold)" stroke-width="2.5" fill="#090d16"/>
  <!-- Energy Dashed Orbit Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="url(#favEmerald)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
  <!-- Star Sacred Geometry Orbit -->
  <polygon points="24,8 36,30 12,30" stroke="url(#favEmerald)" stroke-width="1" fill="none" opacity="0.55"/>
  <polygon points="24,40 36,18 12,18" stroke="url(#favEmerald)" stroke-width="1" fill="none" opacity="0.55"/>
  <!-- Diamond Crystal Core -->
  <polygon points="24,9 35,24 24,39 13,24" fill="url(#favEmerald)" filter="url(#favGlow)" opacity="0.95"/>
  <!-- Facet Reflection Shading -->
  <polygon points="24,9 24,39 13,24" fill="#ffffff" opacity="0.4"/>
  <!-- Inner Core Center -->
  <polygon points="24,15 30,24 24,33 18,24" fill="#042f2e" opacity="0.7"/>
  <!-- Center Power Star -->
  <circle cx="24" cy="24" r="2.8" fill="#ffffff" filter="url(#favGlow)"/>
</svg>
