<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Background Space Glow -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="70%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Metallic Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Emerald / Cyan Neon Energy -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Soft / Strong Glow Filters -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="url(#spaceBg)" />

  <!-- Outer Ambient Aura -->
  <circle cx="512" cy="512" r="440" fill="url(#energyGrad)" opacity="0.12" filter="url(#superGlow)" />

  <!-- Coin Outer Rim (Gold Gear/Rune Edge) -->
  <circle cx="512" cy="512" r="450" stroke="url(#goldRim)" stroke-width="36" fill="#090e1a" filter="url(#coreGlow)" />
  <circle cx="512" cy="512" r="430" stroke="#fde68a" stroke-width="4" opacity="0.6" fill="none" />
  
  <!-- Outer Energy Orbit Ring -->
  <circle cx="512" cy="512" r="390" stroke="url(#energyGrad)" stroke-width="12" stroke-dasharray="24 16" opacity="0.85" filter="url(#coreGlow)" />
  <circle cx="512" cy="512" r="370" stroke="#00f2fe" stroke-width="3" opacity="0.4" fill="none" />

  <!-- Sacred Geometry Stars & Hexagram -->
  <polygon points="512,180 780,640 244,640" stroke="url(#energyGrad)" stroke-width="10" fill="none" opacity="0.45" />
  <polygon points="512,844 780,384 244,384" stroke="url(#energyGrad)" stroke-width="10" fill="none" opacity="0.45" />

  <!-- Outer Diamond Guard Shield -->
  <polygon points="512,140 820,512 512,884 204,512" stroke="url(#energyGrad)" stroke-width="6" fill="none" opacity="0.6" />

  <!-- Central Prism Nexus Diamond -->
  <polygon points="512,200 740,512 512,824 284,512" fill="url(#energyGrad)" filter="url(#superGlow)" opacity="0.95" />
  
  <!-- Facet Reflections & Cuts -->
  <polygon points="512,200 512,824 284,512" fill="#ffffff" opacity="0.32" />
  <polygon points="512,200 740,512 512,512" fill="#ffffff" opacity="0.18" />
  
  <!-- Inner Sacred Core -->
  <polygon points="512,320 640,512 512,704 384,512" fill="#03211f" stroke="#00f2fe" stroke-width="8" opacity="0.8" />
  
  <!-- Radiant Core Energy Star -->
  <circle cx="512" cy="512" r="40" fill="#ffffff" filter="url(#superGlow)" />
  <circle cx="512" cy="512" r="18" fill="#e0f2fe" />

  <!-- Ray Flares -->
  <line x1="512" y1="260" x2="512" y2="764" stroke="#ffffff" stroke-width="3" opacity="0.7" filter="url(#superGlow)" />
  <line x1="260" y1="512" x2="764" y2="512" stroke="#ffffff" stroke-width="3" opacity="0.7" filter="url(#superGlow)" />
</svg>
